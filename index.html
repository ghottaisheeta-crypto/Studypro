<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boards Ai - Hindi & English Medium Study App</title>
  <style>
    :root {
      --primary: #4f46e5;
      --accent: #f97316;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1e1b4b, #5b21b6, #be185d);
      color: white;
      padding: 20px 16px 26px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
    }
    .brand-badge {
      display: inline-block;
      background: rgba(255,255,255,0.18);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .header h1 { font-size: 21px; font-weight: 800; line-height: 1.3; }
    .header p { font-size: 12.5px; opacity: 0.92; margin-top: 5px; }
    
    .header-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .pill-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.35);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .lang-toggle {
      background: #facc15;
      color: #1e1b4b;
      border: none;
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Container */
    .container { max-width: 600px; margin: -14px auto 0; padding: 0 14px; }

    /* Tabs */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      background: var(--card);
      padding: 8px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      margin-bottom: 14px;
    }
    .tab-btn {
      border: none;
      background: #f8fafc;
      padding: 10px 4px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .tab-btn span.icon { font-size: 18px; }
    .tab-btn.active {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      box-shadow: 0 4px 10px rgba(249, 115, 22, 0.35);
    }

    /* Card */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }
    .card-title { font-size: 17px; font-weight: 800; }
    .tag {
      display: inline-block;
      background: #ffedd5;
      color: #c2410c;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 8px;
      margin: 6px 0 12px;
    }

    /* Subject Chips */
    .subject-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .sub-chip {
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      white-space: nowrap;
      cursor: pointer;
    }
    .sub-chip.active {
      background: #eef2ff;
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Medium Bar */
    .medium-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 8px 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .med-btns { display: flex; gap: 6px; }
    .med-btn {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: white;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .med-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    textarea {
      width: 100%;
      height: 105px;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      resize: none;
      outline: none;
      margin-bottom: 10px;
    }
    textarea:focus { border-color: var(--primary); }

    .sample-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .samples { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .sample-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      color: #1e293b;
    }

    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(249, 115, 22, 0.35);
    }

    /* Output Box */
    .output-box {
      display: none;
      background: #ffffff;
      border-left: 5px solid var(--primary);
      border-radius: 16px;
      padding: 15px;
      margin-top: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      line-height: 1.65;
      font-size: 14px;
    }
    .output-box h3 { color: var(--primary); margin-bottom: 8px; font-size: 16px; }
    .output-box ul { padding-left: 18px; margin: 8px 0; }
    .output-box li { margin-bottom: 7px; }
    .copy-out-btn {
      margin-top: 12px;
      background: #eef2ff;
      color: var(--primary);
      border: 1px solid #c7d2fe;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Quiz */
    .quiz-q { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; }
    .quiz-q p { font-weight: 700; margin-bottom: 8px; }
    .opt-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 9px 12px;
      margin-bottom: 6px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      background: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .opt-btn.correct { background: #dcfce7; border-color: #16a34a; color: #15803d; }
    .opt-btn.wrong { background: #fee2e2; border-color: #dc2626; color: #b91c1c; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
    }
    .modal-content input {
      width: 100%;
      padding: 11px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 14px;
    }
    .footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="brand-badge">🚀 We Are Also Student • Hindi & English Medium</div>
    <h1>Boards Ai — Created by <span id="creatorName">Future Topper</span></h1>
    <p>No Ratta, Only Smart Concept! • 10th Boards Study Partner</p>
    <div class="header-actions">
      <button class="pill-btn" onclick="openNameModal()">✏️ Apna Naam</button>
      <button class="pill-btn" onclick="openKeyModal()">🤖 AI: <span id="aiStatus">Built-in</span></button>
      <button class="lang-toggle" id="topLangBtn" onclick="toggleMedium()">🌐 Medium: English</button>
    </div>
  </div>

  <div class="container">
    <!-- Feature Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('notes', this)">
        <span class="icon">⚡</span>15-Min Notes
      </button>
      <button class="tab-btn" onclick="switchTab('concept', this)">
        <span class="icon">🧠</span>No-Ratta
      </button>
      <button class="tab-btn" onclick="switchTab('pyq', this)">
        <span class="icon">📄</span>Board PYQs
      </button>
      <button class="tab-btn" onclick="switchTab('test', this)">
        <span class="icon">📝</span>Tuition Test
      </button>
    </div>

    <!-- Main Card -->
    <div class="card">
      <div class="card-title" id="sectionTitle">⚡ 15-Min One-Shot Revision</div>
      <div class="tag" id="sectionTag">Last-Minute Exam Saviour</div>

      <!-- Subject Chips -->
      <div class="subject-row">
        <button class="sub-chip active" id="chip-SST" onclick="selectSubject('SST', this)">🌍 SST (सामाजिक विज्ञान)</button>
        <button class="sub-chip" id="chip-Sanskrit" onclick="selectSubject('Sanskrit', this)">🕉️ Sanskrit (संस्कृत)</button>
        <button class="sub-chip" id="chip-Science" onclick="selectSubject('Science', this)">🔬 Science</button>
        <button class="sub-chip" id="chip-Maths" onclick="selectSubject('Maths', this)">📐 Maths</button>
        <button class="sub-chip" id="chip-English" onclick="selectSubject('English', this)">📚 English</button>
      </div>

      <!-- Medium Selector Bar -->
      <div class="medium-bar">
        <span>📖 Answer Medium:</span>
        <div class="med-btns">
          <button class="med-btn active" id="btn-eng" onclick="setMedium('English')">🇬🇧 English</button>
          <button class="med-btn" id="btn-hin" onclick="setMedium('Hindi')">🇮🇳 हिंदी माध्यम</button>
        </div>
      </div>
